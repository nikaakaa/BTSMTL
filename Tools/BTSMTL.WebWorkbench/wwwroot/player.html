<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTSMTL · 预览画面</title>
  <link rel="stylesheet" href="documents.css">
  <link rel="stylesheet" href="preview.css">
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">B</span><strong>BTSMTL</strong><span>预览画面</span></div><a href="preview.html">返回运行观察</a><span id="connection" class="connection">正在连接项目宿主</span></header>
  <main class="preview-layout">
    <aside class="preview-sidebar">
      <div class="eyebrow">PREVIEW PLAYER</div><h1>常驻播放器</h1>
      <label for="build">播放器构建</label><select id="build"></select><code id="build-info"></code>
      <button id="start-live" class="primary" disabled>启动常驻播放器</button>
      <h2>已启动</h2><div id="lives" class="run-list"></div>
      <h2>载入内容</h2>
      <label for="run">.NET 本地输入运行（逐帧对照）</label><select id="run"></select>
      <button id="load-run" disabled>载入此运行</button>
      <label for="scene">离线包（实时试玩，无对照）</label><select id="scene"></select><code id="scene-version"></code>
      <button id="load-scene" disabled>载入并试玩</button>
      <div class="preview-note">画面由已登记的来源渲染后推到这里。按运行载入时，播放器采用相同内容与输入日程，逐帧比较一致性值；一致才把画面当作该运行的结果。</div>
    </aside>
    <section class="preview-main">
      <header class="preview-header"><div><h1 id="live-title">选择或启动播放器</h1><code id="live-identity"></code></div><button id="stop-live" hidden>停止播放器</button></header>
      <div id="live-state" class="run-state" role="status">尚未连接播放器。</div>
      <div class="player-stage" id="stage">
        <canvas id="video"></canvas><canvas id="overlay"></canvas>
        <div id="capture-hint" class="capture-hint" hidden>点击画面接管键鼠；Esc 释放。手柄自动转发。</div>
      </div>
      <div class="frame-transport" id="transport">
        <button data-command="play" disabled>播放</button><button data-command="pause" disabled>暂停</button><button data-command="step" disabled>单步</button>
        <input id="seek" type="range" min="0" max="0" value="0" disabled aria-label="跳转确认帧"><output id="frame-label">无确认帧</output>
      </div>
      <div class="frame-transport player-options">
        <label><input id="orbit" type="checkbox" disabled> 环绕相机</label>
        <button id="reset-camera" disabled>重置视角</button>
        <label><input id="overlay-dotnet" type="checkbox" disabled> 叠加 .NET 根位置</label>
        <label><input id="capture-input" type="checkbox" disabled> 试玩接管输入</label>
        <button id="capture" disabled>保存截图</button>
      </div>
      <div class="frame-facts"><dl id="live-facts"></dl><h2>点选</h2><div id="pick-result"><p class="muted">未接管输入时单击画面，选取最近的角色。</p></div></div>
    </section>
    <aside class="preview-details"><h2>逐帧对照</h2><dl id="alignment"></dl><h2>命令回执</h2><pre id="acks"></pre></aside>
  </main>
  <footer class="statusbar"><span id="status" role="status">正在连接…</span></footer>
  <script type="module" src="player.js"></script>
</body>
</html>
