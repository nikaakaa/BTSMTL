<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline · BTSMTL</title>
  <link rel="stylesheet" href="preview.css">
  <script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <main class="timeline-workbench">
    <header class="subject-toolbar">
      <strong>Timeline</strong>
      <select id="run-select" aria-label="选择运行" disabled><option>选择运行</option></select>
      <span class="toolbar-spacer"></span>
      <button id="settings-open" title="预览设置" aria-label="预览设置">⚙</button>
    </header>
    <section class="preview-toolbar" aria-label="预览行">
      <div class="preview-modes" role="group" aria-label="预览档位">
        <button data-preview-mode="off" aria-pressed="false" disabled>关</button>
        <button data-preview-mode="quick" aria-pressed="false" disabled title="宿主尚未提供快速预览">快</button>
        <button data-preview-mode="real" aria-pressed="true" disabled>真</button>
      </div>
      <button id="preview-toggle" aria-label="播放" title="播放" disabled>▶</button>
      <button id="previous-frame" disabled aria-label="上一个封存帧" title="上一帧">‹</button>
      <button id="next-frame" disabled aria-label="下一个封存帧" title="下一帧">›</button>
      <output id="frame-label">—</output>
      <span id="status" role="status">连接中</span>
      <label for="scene">场景</label><select id="scene" aria-label="场景"></select>
    </section>
    <div id="run-state" class="run-error" role="alert" hidden></div>
    <section id="preview-content"><section id="execution-observation" aria-label="Timeline 与节点图"></section></section>
  </main>
  <dialog id="preview-settings">
    <header><strong>预览设置</strong><span id="connection">连接中</span><button id="settings-close" aria-label="关闭预览设置">×</button></header>
    <section id="runtime-sources" inert>
      <label for="run-source">输入来源</label><select id="run-source"><option value="replay">录像</option><option value="local">输入方案</option></select>
      <div id="replay-source"><label for="replay">录像</label><select id="replay"></select></div>
      <div id="local-source" hidden><button id="load-inputs">读取输入声明</button><p id="input-state">尚未提供输入方案来源。</p><div id="input-events"></div></div>
      <label class="checkbox-label"><input id="interactive" type="checkbox" checked> 启动后暂停</label>
      <div class="settings-actions"><button id="start" disabled>重新播放</button><button id="refresh">刷新</button><button id="cancel" hidden>取消运行</button></div>
      <div id="playback-controls" class="settings-actions" hidden><button data-control="Step">单步</button><button data-control="Stop">停止</button><label class="checkbox-label"><input id="follow-live" type="checkbox" checked> 跟随当前帧</label><output id="playback-state"></output></div>
    </section>
    <details><summary>运行信息</summary><output id="run-title"></output><code id="run-identity"></code><pre id="run-error-detail"></pre><dl id="run-details"></dl><p id="channels"></p><code id="scene-version"></code><code id="replay-version"></code><p id="source-state"></p></details>
    <details id="capabilities" hidden><summary id="capability-state">预览能力</summary><dl id="capability-details"></dl></details>
    <details><summary>逻辑视图</summary><div class="preview-stage"><div id="viewport"></div></div><button id="fit-view" disabled>适配角色</button></details>
    <details><summary>帧记录</summary><dl id="frame-facts"></dl><div id="actors"></div><details id="frame-record-details"><summary>完整记录</summary><div id="frame-sections"></div></details><details><summary>JSON</summary><pre id="frame-json"></pre></details></details>
    <details><summary>记录查询</summary><section id="observation-query"></section></details>
    <details><summary>运行比较</summary><select id="comparison" aria-label="比较运行"></select><button id="compare" disabled>比较</button><pre id="comparison-result"></pre></details>
  </dialog>
  <script type="module" src="preview.js"></script>
</body>
</html>
